name: CI

# The push list is a pattern, not an enumeration: cycle branches follow vX.Y
# and the old explicit list went stale silently — v2.5 got no CI on push, only
# once its PR opened. On pull_request the filter matches the *base* branch, so
# main alone covers every PR into it.
on:
  push:
    branches: [main, 'v[0-9]*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        # The dev extra pulls in `build`, without which tests/test_packaging.py
        # skips — and that file is the only proof the wheel actually carries
        # the embedded artifacts (PLAN-2.1 F1).
        run: pip install ".[dev]"
      - name: Run tests
        run: python -m unittest discover -s tests
