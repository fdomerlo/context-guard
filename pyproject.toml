[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-guard"
version = "2.0.0"
description = "The transactional memory layer for AI coding agents — your context survives crashes, compaction, and session loss"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=1.0.0,<2.0.0"]

[project.scripts]
context-guard = "context_guard.guard.cli:main"
cg = "context_guard.guard.cli:main"
context-guard-mcp = "context_guard.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["context_guard"]

[tool.hatch.build.targets.sdist]
# hatchling's default sdist selection does not consult the user's global
# gitignore (~/.config/git/ignore) — only the repo's own .gitignore and VCS
# tracking. .claude/settings.local.json is untracked and ignored globally,
# not locally, so it slipped into a `uv build` sdist carrying this machine's
# absolute home paths. Excluded explicitly rather than relying on any
# gitignore to keep local agent tooling out of a published artifact.
exclude = [".claude/"]
