[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-guard"
version = "1.0.0"
description = "Middleware transaccional y gestor de estado estricto para agentes de IA (MCP)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["mcp>=1.0.0"]

[project.scripts]
context-guard = "context_guard.guard.cli:main"
context-guard-mcp = "context_guard.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["context_guard"]
